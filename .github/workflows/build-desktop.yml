name: build-desktop

on:
  workflow_call:
    inputs:
      artifact-path:
        description: Files or globs to upload from electron-builder output
        type: string
        default: release

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist
      - name: Configure license secret
        shell: bash
        env:
          LICENSE_SECRET: ${{ secrets.COPYCRAFT_LICENSE_SECRET }}
        run: |
          if [ -n "$LICENSE_SECRET" ]; then
            node -e "const fs=require('fs'); fs.writeFileSync('electron/license-secret.cjs', 'module.exports = ' + JSON.stringify(process.env.LICENSE_SECRET) + ';\n')"
          fi
      - name: Require license secret for release builds
        if: github.event_name == 'release' || github.event.inputs.tag != ''
        shell: bash
        run: test -f electron/license-secret.cjs
      - run: npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: ${{ inputs.artifact-path }}
          if-no-files-found: error
