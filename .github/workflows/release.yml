name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: '发布 tag（如 v0.3.1）；留空则只打包，不发布'
        required: false
        type: string
      prerelease:
        description: '标记为预发布'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web:
    name: Web (static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          if-no-files-found: error

  desktop:
    needs: web
    uses: ./.github/workflows/build-desktop.yml
    secrets: inherit
    with:
      artifact-path: |
        release/*.dmg
        release/*.pkg
        release/*.zip
        release/*.exe
        release/*.blockmap

  publish:
    name: Publish release assets
    needs: desktop
    if: github.event_name == 'release' || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - name: List assets
        run: ls -lh release-assets
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.event_name == 'release' && github.event.release.prerelease || inputs.prerelease }}
          draft: false
          files: release-assets/**
