appId: com.copycraft.app
productName: CopyCraft
copyright: Copyright © 2026 CopyCraft
artifactName: CopyCraft-${version}-${os}-${arch}.${ext}

# Enables electron-updater: electron-builder writes app-update.yml into the
# package and latest.yml / latest-mac.yml next to the installers.
publish:
  provider: github
  owner: niyongsheng
  repo: CopyCraft

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - electron/**/*
  - build/icon.png
  - package.json

asar: true
npmRebuild: false

extraResources:
  - from: LICENSE
    to: LICENSE
  - from: PRIVACY.md
    to: PRIVACY.md
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  - from: ARPHICPL.TXT
    to: ARPHICPL.TXT

mac:
  category: public.app-category.education
  icon: build/icon.icns
  # Ad-hoc sign unsigned builds. An unsigned (or invalidly signed) app that has
  # been downloaded gets a quarantine flag, and Gatekeeper then reports it as
  # "damaged". Ad-hoc signing keeps the bundle seal valid, so macOS shows the
  # normal "unidentified developer" prompt instead.
  identity: "-"
  hardenedRuntime: false
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: pkg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64

dmg:
  title: CopyCraft

pkg:
  # Postinstall lives in build/pkg-scripts/postinstall. It runs after the
  # installer copies the app to /Applications and clears the quarantine flag,
  # so an unsigned build launches without Gatekeeper blocking it.
  scripts: pkg-scripts
  installLocation: /Applications

win:
  icon: build/icon.ico
  executableName: CopyCraft
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: CopyCraft
  artifactName: CopyCraft-Setup-${version}-${arch}.${ext}

portable:
  artifactName: CopyCraft-Portable-${version}-${arch}.${ext}

linux:
  icon: build/icon.png
  category: Education
  maintainer: CopyCraft <niyongsheng@Outlook.com>
  executableName: copycraft
  syncDesktopName: true
  synopsis: Copybook worksheet generator
  description: CopyCraft 字帖工坊 — 支持汉字、拼音、英文、数学等多种字帖，可导出 PDF/Word。
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
